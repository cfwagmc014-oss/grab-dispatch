<head>

<style>
:root{--red:#D71920;--bg:#f5f5f6;--b:#e1e3e6;--t:#1d2230;--m:#6a7280;--ok:#12805c;--warn:#c77700}
*{box-sizing:border-box}
body{background-image:linear-gradient(180deg,#fff4f0 0,#f3f7ff 380px);background-attachment:fixed;margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}

header h1{font-size:17px;margin:0}
.hr{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#9aa}
.dot.on{background:#5CFF9D}.dot.off{background:#ffd0d0}
nav{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--b);background:#fff;overflow:auto}
nav button{background:none;border:0;padding:10px 14px;font:inherit;color:var(--m);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}

main{max-width:1150px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.k{--c:#3b5bdb;--t1:#edf2ff;background:linear-gradient(145deg,var(--t1),#fff 85%);border:1px solid var(--t1);border-top:4px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px rgba(30,40,80,.07)}
.k b{color:var(--c)}
.k.gray{--c:#6c757d;--t1:#eceff3}.k.green{--c:#12805c;--t1:#e3f8ee}.k.blue{--c:#1c7ed6;--t1:#e7f3ff}.k.amber{--c:#e67700;--t1:#fff1d6}.k.teal{--c:#0b9a8d;--t1:#dcf8f4}.k.rose{--c:#e03131;--t1:#ffe3e3}.k.purple{--c:#7048e8;--t1:#efe9ff}.k.pink{--c:#d6336c;--t1:#ffe6f0}
.k small{display:block;color:var(--m);font-size:11.5px;margin-top:2px}
.k i.ic{font-style:normal;float:right;font-size:20px}
.k b{display:block;font-size:26px}.k span{color:var(--m);font-size:12.5px}
.k.alert{--c:#e03131;--t1:#ffe3e3}
.card{background:#fff;border:1px solid var(--b);border-left:4px solid #4c6ef5;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(30,40,80,.06)}
.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--b);vertical-align:middle}
th{color:var(--m);font-weight:500;font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:#eef0f3;color:var(--m)}
.chip.red{background:#fde8e9;color:var(--red);font-weight:600}.chip.ok{background:#d3f9e5;color:#087f5b;font-weight:600}.chip.warn{background:#fff0cc;color:#d9480f;font-weight:600}.chip.bl{background:#e7f3ff;color:#1c7ed6;font-weight:600}
button.p{background:linear-gradient(100deg,#D71920,#ff5a3c);box-shadow:0 2px 6px rgba(215,25,32,.3);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.s{background:#fff;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;font-size:13px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--b);border-radius:8px;background:#fff}
.bar{height:10px;background:#eceef1;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--red)}
.pl{display:grid;grid-template-columns:130px 1fr 120px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.my{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.job{background:linear-gradient(145deg,#f3f8ff,#fff);border:2px solid #cfe0ff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(30,60,140,.08)}

.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--b);border-radius:14px;padding:26px;text-align:center}
.err{color:var(--red);margin-top:10px;font-size:14px}.muted{color:var(--m);font-size:13px}
.duty{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;margin-bottom:12px;border:2px solid var(--ok);background:#eaf7f1}
.duty.brk{border-color:var(--warn);background:#fff6e6}
.duty b{font-size:16px}
.boards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;margin-bottom:14px;align-items:start;overflow-x:auto;padding-bottom:6px}

.rng select{border-radius:18px}

.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut svg{width:150px;height:150px}
.lg{font-size:13.5px}.lg div{margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

.heat{border-collapse:separate;border-spacing:2px;font-size:11.5px}.heat td,.heat th{padding:3px 0;text-align:center;min-width:26px;border:0;border-radius:3px}

.okmsg{background:#eaf7f1;border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.gbtn{background:linear-gradient(100deg,#12b886,#0ca678);box-shadow:0 3px 10px rgba(18,184,134,.4);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}.gbtn:disabled{opacity:.7;cursor:default}
.items{margin-top:8px;font-size:13.5px;border-top:1px dashed var(--b);padding-top:4px;text-align:left}
.it{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f0f1f3;align-items:flex-start}.it:last-child{border-bottom:0}
.it .q{min-width:38px;font-weight:700;color:var(--red);font-size:15px}.it small{color:var(--m);display:block}
.it.ok{background:#eaf9f1}.it.no{background:#fff0f0}.pk{display:flex;gap:4px;margin-left:auto;flex-shrink:0}.pk button{padding:3px 9px;font-size:12px;border-radius:14px;border:1px solid #cfd4dc;background:#fff;color:#495057;cursor:pointer}.pk button.y.on{background:#12b886;border-color:#12b886;color:#fff}.pk button.n.on{background:#e03131;border-color:#e03131;color:#fff}.pkc{font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}
.it .nw{background:#e3f4ec;color:var(--ok);border-radius:8px;padding:0 6px;font-size:11.5px;font-weight:600;margin-left:4px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';

  const f = new Date(d + 'T00:00:00').getTime(), n = S.orders.filter(o => o.created_at >= f && o.created_at < f + 86400000).length;
  if (!n) { alert('ไม่พบออเดอร์ของวันที่ ' + d.split('-').reverse().join('/')); return; }
  if (!confirm('⚠️ ลบข้อมูลออเดอร์ของวันที่ ' + d.split('-').reverse().join('/') + ' ทั้งหมด (' + n + ' ออเดอร์) ใช่ไหม?\n\nลบแล้วกู้คืนไม่ได้ และตัวเลขใน Dashboard ของวันนั้นจะหายไป')) return;
  api('purgeDay', { date: d }).then(r => { if (!r.ok) { alert('ไม่สำเร็จ: ' + (ERR[r.error] || r.error)); return; } toast('✅ ลบข้อมูลแล้ว ' + r.deleted + ' ออเดอร์'); poll(); });
}
function saveClose(off) {
  const t = off ? '' : $('closeT').value;
  if (!off && !t) { alert('กรุณาเลือกเวลา'); return; }
  if (!confirm(off ? 'ยกเลิกการปิดระบบอัตโนมัติใช่ไหม?' : 'ตั้งปิดระบบอัตโนมัติ ' + t + ' น. ทุกวัน?\n\n⚠️ ถึงเวลานั้นทุกคนจะถูกออกจากระบบ และงานที่ยังไม่จัดจะไม่ถูกแจกจนกว่าจะเปิดระบบ/ขึ้นวันใหม่')) return;
  api('setClose', { time: t }).then(r => { if (!r.ok) { alert('ไม่สำเร็จ: ' + (ERR[r.error] || r.error)); return; } toast(off ? '✅ ยกเลิกการตั้งเวลาแล้ว' : '✅ ตั้งปิดระบบ ' + t + ' น. แล้ว'); poll(); });
}
function sysOpen() {
  if (!confirm('เปิดระบบอีกครั้งใช่ไหม?\n\nคนจัดที่เปิดหน้าเว็บค้างไว้จะเข้างานและรับงานอัตโนมัติ')) return;
  api('sysOpen').then(r => { if (!r.ok) { alert('ไม่สำเร็จ: ' + r.error); return; } toast('✅ เปิดระบบแล้ว'); poll(); });
}
function viewControl() {
  const list = S.pickers.filter(p => !p.guest);
  const sel = (p, r) => '<option value="' + r + '"' + (p.role === r ? ' selected' : '') + '>' + roleTh(r) + '</option>';
  return (ctrlMsg ? '<div class="okmsg">' + esc(ctrlMsg) + '</div>' : '') + dispatchCard(S.orders.filter(o => o.status === 'todo'), S.pickers.filter(p => p.role === 'picker')) + guestPanel() + closeCard() + purgeCard() +
    '<div class="card"><h2>ทีมงานและสิทธิ์</h2><div class="muted" style="margin-bottom:8px">แก้ชื่อ อีเมล สิทธิ์ หรือสถานะ แล้วกด <b>บันทึก</b> ที่แถวนั้น · picker = รับงานจัดของ · viewer = ดู Dashboard อย่างเดียว · admin = จัดการทั้งหมด · "อยู่ในทีม" ปิดเมื่อหยุดยาว/ลาออก (งานค้างจะถูกแจกให้คนอื่นทันที) · ถ้าเปลี่ยนอีเมล คนนั้นต้องล็อกอินด้วยอีเมลใหม่ (และต้องเป็น Test user ใน Google Cloud)</div>' +
    '<div style="overflow:auto"><table><tr><th>ชื่อ</th><th>อีเมล Google</th><th>สิทธิ์</th><th>อยู่ในทีม</th><th>สถานะตอนนี้</th><th></th></tr>' + list.map((p, i) =>
      '<tr><td><input id="cN_' + i + '" value="' + esc(p.name) + '" size="14"></td><td><input id="cE_' + i + '" value="' + esc(p.email) + '" size="26"></td>' +
      '<td><select id="cR_' + i + '">' + sel(p, 'picker') + sel(p, 'viewer') + sel(p, 'admin') + '</select></td>' +
      '<td style="text-align:center"><input type="checkbox" id="cA_' + i + '" ' + (p.active ? 'checked' : '') + '></td>' +
      '<td>' + (p.role !== 'picker' ? '' : !p.active ? '<span class="chip">ไม่อยู่ในทีม</span>' : !p.duty ? '<span class="chip warn">พัก</span>' : p.online ? '<span class="chip ok">พร้อมรับงาน</span>' : '<span class="chip">ออฟไลน์</span>') + '</td>' +
      '<td style="white-space:nowrap"><button class="p" style="padding:6px 12px" onclick="editPicker(' + i + ',this)">บันทึก</button> <button class="s" onclick="delPicker(\'' + esc(p.email) + '\')">ลบ</button></td></tr>').join('') + '</table></div></div>' +
    '<div class="card"><h2>เพิ่มคนใหม่</h2><div class="row"><input id="nName" placeholder="ชื่อ"><input id="nMail" placeholder="อีเมล Google" size="26"><select id="nRole"><option value="picker">picker (คนจัดของ)</option><option value="viewer">viewer (ดูภาพรวม ไม่มี Control)</option><option value="admin">admin (ทำได้ทุกอย่าง)</option></select><button class="p" onclick="addPicker()">เพิ่ม</button></div></div>';
}
function clearCtrlDrafts() { Object.keys(draft).forEach(k => { if (/^c[NERA]_/.test(k)) delete draft[k]; }); }
function editPicker(i, btn) {
  const p = S.pickers.filter(x => !x.guest)[i]; if (!p) return;
  const body = { oldEmail: p.email, email: $('cE_' + i).value.trim(), name: $('cN_' + i).value.trim(), role: $('cR_' + i).value, active: $('cA_' + i).checked };
  const ch = []; if (body.name !== p.name) ch.push('ชื่อ: ' + p.name + ' → ' + body.name); if (body.email.toLowerCase() !== p.email) ch.push('อีเมล: ' + p.email + ' → ' + body.email);
  if (body.role !== p.role) ch.push('สิทธิ์: ' + p.role + ' → ' + body.role); if (body.active !== p.active) ch.push(body.active ? 'กลับเข้าทีม' : '⚠️ ออกจากทีม (งานค้างจะถูกแจกให้คนอื่น)');
  if (!confirm('บันทึกการแก้ไขของ "' + p.name + '" ใช่ไหม?\n\n' + (ch.length ? ch.join('\n') : '(ไม่มีการเปลี่ยนแปลง)'))) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก…'; }
  api('savePicker', body).then(r => {
    if (!r.ok) { alert('บันทึกไม่สำเร็จ: ' + (ERR[r.error] || r.error)); if (btn) { btn.disabled = false; btn.textContent = 'บันทึก'; } return; }
    clearCtrlDrafts(); toast('✅ บันทึกแล้ว: ' + (body.name || body.email)); ctrlMsg = '✅ บันทึกแล้ว: ' + (body.name || body.email); poll(); render(); setTimeout(() => { ctrlMsg = ''; if (S) render(); }, 3500);
  }).catch(() => { alert('เชื่อมต่อไม่ได้ ยังไม่ได้บันทึก'); if (btn) { btn.disabled = false; btn.textContent = 'บันทึก'; } });
}
function setDuty(on) { if (!confirm(on ? 'กลับมารับงานใช่ไหม?' : 'ไปพักใช่ไหม?\n\n⚠️ งานที่ค้างอยู่ของคุณจะถูกส่งต่อให้คนอื่นทันที และจะไม่มีงานใหม่เข้าจนกว่าจะกดกลับมารับงาน')) return; if (S) { const mp = S.pickers.find(p => p.key === S.me.email); if (mp) mp.duty = on; render(); } api('duty', { on }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); else toast(on ? '✅ กลับมารับงานแล้ว' : '✅ บันทึกสถานะพักแล้ว งานค้างถูกส่งต่อให้คนอื่น'); poll(); }); }
const ROLE_TH = { admin: 'admin (ทำได้ทุกอย่าง)', picker: 'picker (คนจัด)', viewer: 'viewer (ดูภาพรวม ไม่มี Control)' };
const roleTh = r => ROLE_TH[r] || r;
function setTab(t) { tab = t; clearCtrlDrafts(); render(); }
function reassignJob(id, sel) {
  const name = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
  if (!sel.value || !confirm('ย้ายออเดอร์ ' + id + ' ไปให้ "' + name + '" ใช่ไหม?')) { render(); return; }
  api('reassign', { id, email: sel.value }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); else toast('✅ ย้าย ' + id + ' ไปให้ ' + name + ' แล้ว'); poll(); });
}
function act(action, id, email) { api(action, { id, email }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); poll(); }); }
function savePicker(email, name, role, active) { api('savePicker', { email, name, role, active }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); poll(); }); }
function delPicker(email) { if (confirm('ลบ ' + email + ' ออกจากระบบ?\n\n⚠️ งานค้างของคนนี้จะถูกแจกให้คนอื่น และเขาจะล็อกอินไม่ได้อีก')) api('delPicker', { email }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + (ERR[r.error] || r.error)); else toast('✅ ลบ ' + email + ' แล้ว'); poll(); }); }
function addPicker() { const n = $('nName').value.trim(), m = $('nMail').value.trim(), r = $('nRole').value; if (!m) { alert('กรุณาใส่อีเมล Google ก่อน'); return; } if (!confirm('เพิ่ม "' + (n || m) + '" (' + m + ') เป็น ' + r + ' ใช่ไหม?')) return; api('savePicker', { email: m, name: n || m, role: r, active: true }).then(x => { if (!x.ok) alert('ไม่สำเร็จ: ' + x.error); else { delete draft.nName; delete draft.nMail; toast('✅ เพิ่ม ' + (n || m) + ' แล้ว'); } poll(); }); }
function logout() { if (!confirm('ออกจากระบบใช่ไหม?' + (S && S.me && S.me.role === 'picker' ? '\n\n⚠️ งานที่ค้างอยู่ของคุณจะถูกส่งต่อให้คนอื่นทันที' : ''))) return; try { if (token) api('logout'); } catch (e) {} token = null; S = null; try { localStorage.removeItem('gd_token'); } catch (e) {} try { google.accounts.id.disableAutoSelect(); } catch (e) {} showLogin(); }

try { token = localStorage.getItem('gd_token'); } catch (e) {}
if (gtoken) token = null;
$('app').innerHTML = '<div class="login">กำลังโหลด…</div>';
if (gtoken) poll(); else { initGoogle(); if (token) poll(); }
setInterval(poll, 8000);
</script>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GO EXPRESS ระยอง – Grab Dispatch</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--red:#D71920;--bg:#f5f5f6;--b:#e1e3e6;--t:#1d2230;--m:#6a7280;--ok:#12805c;--warn:#c77700}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{background:var(--red);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
.hr{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#9aa}
.dot.on{background:#5CFF9D}.dot.off{background:#ffd0d0}
nav{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--b);background:#fff;overflow:auto}
nav button{background:none;border:0;padding:10px 14px;font:inherit;color:var(--m);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--red);border-color:var(--red);font-weight:600}
main{max-width:1150px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.k{background:#fff;border:1px solid var(--b);border-radius:10px;padding:10px 12px}
.k b{display:block;font-size:26px}.k span{color:var(--m);font-size:12.5px}
.k.alert b{color:var(--red)}
.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--b);vertical-align:middle}
th{color:var(--m);font-weight:500;font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:#eef0f3;color:var(--m)}
.chip.red{background:#fde8e9;color:var(--red);font-weight:600}.chip.ok{background:#e3f4ec;color:var(--ok)}.chip.warn{background:#fff1dc;color:var(--warn)}
button.p{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.s{background:#fff;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;font-size:13px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--b);border-radius:8px;background:#fff}
.bar{height:10px;background:#eceef1;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.pl{display:grid;grid-template-columns:130px 1fr 120px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.my{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.job{background:#fff;border:2px solid var(--b);border-radius:12px;padding:14px}
.job.urgent{border-color:var(--red);background:#fff6f6}
.job .id{font-size:26px;font-weight:700}.job .n{font-size:15px;margin:2px 0 10px;color:var(--m)}
.job button{width:100%;padding:12px;font-size:16px}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--b);border-radius:14px;padding:26px;text-align:center}
.err{color:var(--red);margin-top:10px;font-size:14px}.muted{color:var(--m);font-size:13px}
.duty{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;margin-bottom:12px;border:2px solid var(--ok);background:#eaf7f1}
.duty.brk{border-color:var(--warn);background:#fff6e6}
.duty b{font-size:16px}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:14px;align-items:start}
.col{background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px}
.col.off{opacity:.65}
.col h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.col .job{padding:10px;margin-bottom:8px;border-width:1.5px}.col .job .id{font-size:20px}.col .job .n{margin:0 0 6px;font-size:13.5px}
.col select{width:100%;margin-top:6px;font-size:13px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.qrbox svg{width:190px;height:190px;border:1px solid var(--b);border-radius:8px;background:#fff}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:14px}
.g2 .card{margin-bottom:0}
.rng{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rng button{border:1px solid var(--b);background:#fff;border-radius:18px;padding:6px 14px;font:inherit;cursor:pointer}
.rng button.on{background:var(--red);color:#fff;border-color:var(--red)}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut svg{width:150px;height:150px}
.lg{font-size:13.5px}.lg div{margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hbar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.hours{display:flex;align-items:flex-end;gap:3px;height:130px;border-bottom:1px solid var(--b);padding-top:6px}
.hours div{flex:1;background:#f0b4b7;border-radius:3px 3px 0 0;min-height:1px;position:relative}.hours div.pk{background:var(--red)}
.hlab{display:flex;gap:3px;font-size:10.5px;color:var(--m)}.hlab span{flex:1;text-align:center}
.heat{border-collapse:separate;border-spacing:2px;font-size:11.5px}.heat td,.heat th{padding:3px 0;text-align:center;min-width:26px;border:0;border-radius:3px}
.heat th{color:var(--m);font-weight:400}.heat td.l{text-align:left;padding-right:8px;white-space:nowrap;color:var(--m)}
.okmsg{background:#eaf7f1;border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase

// URL: http://www.d-project.com/

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {

  $('app').innerHTML = '<div class="login"><h2 style="margin:0 0 4px;color:var(--red)">GO EXPRESS ระยอง</h2><div class="muted" style="margin-bottom:16px">ระบบกระจายออเดอร์ Grab</div><div id="gbtn" style="display:flex;justify-content:center"></div><div class="err">' + esc(loginMsg) + '</div></div>';
  if (window.google && google.accounts) google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'th' });
}

function poll() {
  if ((!token && !gtoken) || busy) return;
  busy = true;
  api('list').then(res => {
    busy = false;
    if (!res.ok) {
      if (gtoken && (res.error === 'bad_gtoken' || res.error === 'guest_ended')) { endGuest('สิ้นสุดการเป็นผู้ช่วยแล้ว ขอบคุณที่ช่วยครับ 🙏'); return; }
      if (res.error === 'bad_token') { token = null; try { localStorage.removeItem('gd_token'); } catch (e) {} loginMsg = ''; showLogin(); try { google.accounts.id.prompt(); } catch (e) {} }
      else if (res.error === 'not_allowed') { loginMsg = 'บัญชี ' + jwtEmail(token) + ' ยังไม่ได้รับสิทธิ์ – แจ้งผู้ดูแลให้เพิ่มอีเมลนี้'; token = null; try { localStorage.removeItem('gd_token'); } catch (e) {} showLogin(); }
      else { loginMsg = 'เกิดข้อผิดพลาด: ' + res.error; if (!S) showLogin(); }
      return;
    }
    S = res; if (!tab) tab = 'orders';
    const ae = document.activeElement;   // ถ้ากำลังพิมพ์/เลือกอยู่ ไม่วาดหน้าใหม่ทับ (กันข้อความหาย)
    if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && $('app').contains(ae)) return;
    render();
  }).catch(() => { busy = false; if (S) { S.offline = true; render(); } });
}

function riderChip(r) {
  if (r === 'arrived') return '<span class="chip red">ไรเดอร์มาถึงแล้ว</span>';
  if (r === 'searching') return '<span class="chip warn">กำลังหาไรเดอร์</span>';
  if (/^eta:/.test(r || '')) return '<span class="chip">ไรเดอร์อีก ' + r.slice(4) + ' นาที</span>';
  return '<span class="chip">-</span>';
}
const startOfDay = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };

function render() {
  const me = S.me, isAdmin = me.role === 'admin', now = S.now;
  if (me.guest && me.gstatus === 'pending') { $('app').innerHTML = '<div class="login"><h2 style="margin:0 0 8px;color:var(--red)">รอผู้ดูแลอนุมัติ…</h2><div class="muted" style="margin-bottom:14px">สวัสดี ' + esc(me.name) + ' · เมื่อผู้ดูแลกดอนุมัติ งานจะเด้งขึ้นหน้านี้เอง</div><button class="s" onclick="leaveGuest()">ยกเลิก</button></div>'; return; }
  const tabs = [['orders', 'Orders Task']];
  if (!me.guest) tabs.push(['dash', 'Dashboard']);
  if (isAdmin) tabs.push(['control', 'Control']);
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const age = S.reader.ts ? now - S.reader.ts : Infinity;
  const online = age < 120000;
  const readerTxt = S.reader.ts ? (online ? 'ตัวอ่าน Grab ออนไลน์ (' + Math.floor(age / 1000) + ' วิที่แล้ว)' : 'ตัวอ่าน Grab หยุดทำงาน ' + mins(age) + ' นาที') : 'ยังไม่เคยรับข้อมูลจาก Grab';
  let h = '<header><h1>🛵 GO EXPRESS ระยอง – Grab Dispatch</h1><div class="hr"><span><span class="dot ' + (online ? 'on' : 'off') + '"></span>' + readerTxt + '</span>' +
    '<span>' + esc(me.name) + ' · ' + (me.guest ? 'ผู้ช่วยด่วน' : esc(me.role)) + '</span>' + (me.guest ? '<button class="s" onclick="leaveGuest()">ยกเลิก / ออก</button>' : '<button class="s" onclick="logout()">ออกจากระบบ</button>') + '</div></header>' +
    '<nav>' + tabs.map(t => '<button class="' + (t[0] === tab ? 'on' : '') + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</nav><main>';
  if (S.offline) h += '<div class="card" style="border-color:var(--warn)">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กำลังลองใหม่…</div>';
  if (!online && S.reader.ts) h += '<div class="card" style="border-color:var(--red)"><b style="color:var(--red)">ตัวอ่าน Grab ไม่ส่งข้อมูล</b> – เช็กว่าคอมที่ร้านยังเปิดหน้า Grab Merchant ค้างไว้และล็อกอินอยู่ ออเดอร์ใหม่จะยังไม่เข้าระบบจนกว่าจะกลับมา</div>';
  h += tab === 'orders' ? viewOrders() : tab === 'dash' ? viewDash() : viewControl();
  $('app').innerHTML = h + '</main>';
  Object.keys(draft).forEach(k => { const el = $(k); if (el) { if (el.type === 'checkbox') el.checked = !!draft[k]; else el.value = draft[k]; } });   // คืนค่าที่พิมพ์ค้างไว้
}

function dutyBar() {
  if (S.me.guest) return '<div class="duty"><div><b>🟢 ผู้ช่วยด่วน – พร้อมรับงาน</b><div class="muted">ระบบแจกออเดอร์ให้อัตโนมัติ · เสร็จแล้วกด "ยกเลิก / ออก" มุมขวาบน งานที่เหลือจะส่งต่อให้คนอื่นทันที</div></div></div>';
  const mp = S.pickers.find(p => p.key === S.me.email) || { duty: true };
  return mp.duty
    ? '<div class="duty"><div><b>🟢 พร้อมรับงาน</b><div class="muted">ระบบแจกออเดอร์ให้คุณอัตโนมัติ · จะไปพักให้กดปุ่มทางขวา</div></div><button class="s" style="padding:10px 18px" onclick="setDuty(false)">☕ พักก่อน</button></div>'
    : '<div class="duty brk"><div><b>☕ กำลังพัก</b><div class="muted">ตอนนี้ไม่มีงานใหม่เข้า งานที่ค้างถูกส่งให้เพื่อนแล้ว</div></div><button class="p" style="padding:10px 18px" onclick="setDuty(true)">กลับมารับงาน</button></div>';
}
function viewMy() {
  const bar = dutyBar();
  const mp = S.pickers.find(p => p.key === S.me.email) || { duty: true };
  if (!mp.duty && !S.me.guest) return bar;
  return bar + viewMyJobs();
}
const jobState = {};   // id -> 'saving' | 'ok'
function viewMyJobs() {
  const mine = S.orders.filter(o => o.status === 'todo' && o.picker_email === S.me.email)
    .sort((a, b) => (b.rider === 'arrived') - (a.rider === 'arrived') || a.created_at - b.created_at);
  const flash = Object.keys(jobState).filter(id => jobState[id] === 'ok' && !mine.some(o => o.id === id));
  const flashHtml = flash.map(id => '<div class="job" style="border-color:var(--ok);background:#eaf7f1"><div class="id">' + esc(id) + '</div><div class="n" style="color:var(--ok);font-weight:600;margin:6px 0 0">✅ ปิดงานสำเร็จ</div></div>').join('');
  if (!mine.length && !flash.length) return '<div class="card" style="text-align:center;padding:40px">🎉 ตอนนี้ไม่มีงานค้าง<div class="muted">ออเดอร์ใหม่จะเด้งขึ้นที่นี่อัตโนมัติ</div></div>';
  const items = mine.reduce((s, o) => s + o.items, 0);
  return '<div class="muted" style="margin-bottom:8px">ค้างจัด ' + mine.length + ' ออเดอร์ / ' + items + ' รายการ</div><div class="my">' + flashHtml + mine.map(o => {
    const st = jobState[o.id];
    const btn = st === 'saving' ? '<button class="p" disabled style="opacity:.75">⏳ กำลังบันทึก…</button>'
      : st === 'ok' ? '<button class="p" disabled style="background:var(--ok)">✅ ปิดงานสำเร็จ</button>'
      : '<button class="p" onclick="doneJob(\'' + o.id + '\')">จัดเสร็จ ✓</button>';
    return '<div class="job' + (o.rider === 'arrived' ? ' urgent' : '') + '"><div class="id">' + esc(o.id) + '</div><div class="n">' + o.items + ' รายการ · ' + (o.amount ? fmtB(o.amount) + ' · ' : '') + 'รอมา ' + mins(S.now - o.created_at) + ' นาที</div><div style="margin-bottom:10px">' + riderChip(o.rider) + '</div>' + btn + '</div>';
  }).join('') + '</div>';
}
function doneJob(id) {
  if (jobState[id]) return;   // กันกดซ้ำ
  jobState[id] = 'saving'; render();
  api('done', { id }).then(r => {
    if (!r.ok) { delete jobState[id]; alert('ปิดงานไม่สำเร็จ: ' + r.error + ' – กดใหม่อีกครั้ง'); render(); return; }
    jobState[id] = 'ok';
    const o = S && S.orders.find(x => x.id === id); if (o) { o.status = 'done'; o.done_at = Date.now(); }   // ยืนยันจากเซิร์ฟเวอร์แล้ว จึงอัปเดตหน้าจอทันที
    render(); poll();
    setTimeout(() => { delete jobState[id]; if (S) render(); }, 2500);
  }).catch(() => { delete jobState[id]; alert('เชื่อมต่อไม่ได้ ยังไม่ได้ปิดงาน – ลองกดใหม่'); render(); });
}

function viewMonitor() {
  const isAdmin = S.me.role === 'admin', now = S.now, sod = startOfDay();
  const todo = S.orders.filter(o => o.status === 'todo');
  const doneToday = S.orders.filter(o => o.status === 'done' && o.done_at >= sod);
  const avg = doneToday.length ? Math.round(doneToday.reduce((s, o) => s + (o.done_at - o.created_at), 0) / doneToday.length / 60000) : 0;
  const oldest = todo.length ? mins(now - Math.min.apply(null, todo.map(o => o.created_at))) : 0;
  const waiting = todo.filter(o => o.rider === 'arrived').length;
  const unassigned = todo.filter(o => !o.picker_email).length;
  const pickers = S.pickers.filter(p => p.role === 'picker');
  const load = {}; pickers.forEach(p => load[p.key] = { items: 0, count: 0, done: 0 });
  todo.forEach(o => { if (load[o.picker_email]) { load[o.picker_email].items += o.items; load[o.picker_email].count++; } });
  doneToday.forEach(o => { if (load[o.picker_email]) load[o.picker_email].done++; });
  const mx = Math.max.apply(null, Object.keys(load).map(k => load[k].items).concat([1]));
  let h = '<div class="kpis">' +
    '<div class="k"><b>' + todo.length + '</b><span>ออเดอร์รอจัด</span></div>' +
    '<div class="k"><b>' + todo.reduce((s, o) => s + o.items, 0) + '</b><span>รายการสินค้ารอจัด</span></div>' +
    '<div class="k ' + (waiting ? 'alert' : '') + '"><b>' + waiting + '</b><span>ไรเดอร์รอรับของ</span></div>' +
    '<div class="k ' + (oldest >= 10 ? 'alert' : '') + '"><b>' + oldest + '</b><span>นาที – ออเดอร์รอนานสุด</span></div>' +
    '<div class="k"><b>' + doneToday.length + '</b><span>จัดเสร็จวันนี้</span></div>' +
    '<div class="k"><b>' + avg + '</b><span>นาที – เวลาเฉลี่ยต่อออเดอร์</span></div>' +
    (unassigned ? '<div class="k alert"><b>' + unassigned + '</b><span>ยังไม่มีคนรับ (ไม่มีคนจัดออนไลน์?)</span></div>' : '') + '</div>';
  if (isAdmin) h += guestPanel();
  const cols = pickers.filter(p => p.active || load[p.key].count);
  const mine = p => todo.filter(o => o.picker_email === p.key).sort((a, b) => (b.rider === 'arrived') - (a.rider === 'arrived') || a.created_at - b.created_at);
  const moveOpts = o => pickers.filter(p => p.active && p.duty && p.online).map(p => '<option value="' + esc(p.key) + '"' + (p.key === o.picker_email ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
  h += '<div class="boards">' + (cols.length ? cols.map(p => {
    const l = load[p.key], live = p.active && p.duty && p.online;
    const st = !p.active ? '<span class="chip">ไม่อยู่ในทีม</span>' : !p.duty ? '<span class="chip warn">พัก</span>' : !p.online ? '<span class="chip">ออฟไลน์</span>' : '<span class="chip ok">พร้อมรับงาน</span>';
    const jobs = mine(p);
    return '<div class="col' + (live ? '' : ' off') + '"><h3><span>' + esc(p.name) + '</span>' + st + '</h3><div class="muted" style="margin-bottom:6px">ค้าง ' + l.count + ' ออเดอร์ / ' + l.items + ' รายการ · เสร็จวันนี้ ' + l.done + '</div><div class="bar" style="margin-bottom:10px"><i style="width:' + Math.round(l.items / mx * 100) + '%"></i></div>' +
      (jobs.length ? jobs.map(o => '<div class="job' + (o.rider === 'arrived' ? ' urgent' : '') + '"><div class="id">' + esc(o.id) + '</div><div class="n">' + o.items + ' รายการ · ' + (o.amount ? fmtB(o.amount) + ' · ' : '') + 'รอมา ' + mins(now - o.created_at) + ' นาที</div><div>' + riderChip(o.rider) + '</div>' +
        (isAdmin ? '<select onchange="act(\'reassign\',\'' + o.id + '\',this.value)">' + moveOpts(o) + '</select>' : '') + '</div>').join('') : '<div class="muted" style="text-align:center;padding:14px 0">ไม่มีงานค้าง</div>') + '</div>';
  }).join('') : '<div class="card muted">ยังไม่มีคนจัดในระบบ</div>') + '</div>';
  const list = todo.concat(S.orders.filter(o => o.status !== 'todo').sort((a, b) => b.done_at - a.done_at).slice(0, 25))
    .sort((a, b) => (a.status === 'todo' ? 0 : 1) - (b.status === 'todo' ? 0 : 1) || a.created_at - b.created_at);
  const opts = o => pickers.filter(p => p.active && p.duty && p.online).map(p => '<option value="' + esc(p.key) + '"' + (p.key === o.picker_email ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
  h += '<div class="card"><h2>รายการออเดอร์</h2><div style="overflow:auto"><table><tr><th>ออเดอร์</th><th>รายการ</th><th>ยอดเงิน</th><th>ผู้จัด</th><th>ไรเดอร์</th><th>รอมา</th><th>สถานะ</th></tr>' + list.map(o => {
    const st = o.status === 'todo' ? '<span class="chip warn">รอจัด</span>' : o.status === 'done' ? '<span class="chip ok">จัดเสร็จ ' + mins(o.done_at - o.created_at) + ' น.</span>' : '<span class="chip">ส่งต่อไรเดอร์แล้ว</span>';
    const who = isAdmin && o.status === 'todo' ? '<select onchange="act(\'reassign\',\'' + o.id + '\',this.value)"><option value="">' + (o.picker_email ? '' : '— ยังไม่มี —') + '</option>' + opts(o) + '</select>' : esc(o.picker_name || '-');
    return '<tr><td><b>' + esc(o.id) + '</b></td><td>' + o.items + '</td><td>' + fmtB(o.amount) + '</td><td>' + who + '</td><td>' + (o.status === 'todo' ? riderChip(o.rider) : '') + '</td><td>' + (o.status === 'todo' ? mins(now - o.created_at) + ' นาที' : '') + '</td><td>' + st + '</td></tr>';
  }).join('') + '</table></div></div>';
  return h;
}

const fmtB = n => n > 0 ? '฿' + Math.round(n).toLocaleString('th-TH') : '-';
const pickMin = o => Math.max(0, Math.round((o.done_at - (o.assigned_at || o.created_at)) / 60000));
const COLORS = ['#D71920', '#0B7285', '#E8A317', '#5F3DC4', '#2B8A3E', '#C2255C', '#495057', '#1971C2'];
let range = 'today';
function setRange(r) { range = r; render(); }
function viewOrders() { return S.me.role === 'picker' ? viewMy() : viewMonitor(); }
function rangeOrders() {
  const days = range === 'today' ? 1 : Number(range);
  const from = startOfDay() - (days - 1) * 86400000;
  return { days, from, os: S.orders.filter(o => o.created_at >= from) };
}
function viewDash() {
  const { days, from, os } = rangeOrders();
  const done = os.filter(o => o.status === 'done'), closed = os.filter(o => o.status === 'closed'), todo = os.filter(o => o.status === 'todo');
  const items = done.reduce((s, o) => s + o.items, 0), money = done.reduce((s, o) => s + (o.amount || 0), 0);
  const avg = done.length ? Math.round(done.reduce((s, o) => s + pickMin(o), 0) / done.length) : 0;
  const noAmt = os.filter(o => !o.amount).length;
  const by = {};
  done.forEach(o => { const k = o.picker_email || o.picker_name || '-'; const b = by[k] || (by[k] = { name: o.picker_name || o.picker_email || '-', n: 0, items: 0, money: 0, t: 0 }); b.n++; b.items += o.items; b.money += o.amount || 0; b.t += pickMin(o); });
  const rows = Object.keys(by).map(k => by[k]).sort((a, b) => b.n - a.n);
  const mxT = Math.max.apply(null, rows.map(r => r.t / r.n).concat([1]));
  // ช่วงเวลาความหนาแน่น
  const hc = new Array(24).fill(0), dayHour = {};
  os.forEach(o => { const d = new Date(o.created_at), hr = d.getHours(), dk = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); hc[hr]++; (dayHour[dk] = dayHour[dk] || new Array(24).fill(0))[hr]++; });
  let first = 24, last = -1; hc.forEach((n, i) => { if (n) { first = Math.min(first, i); last = Math.max(last, i); } });
  const h0 = Math.min(7, first === 24 ? 7 : first), h1 = Math.max(21, last);
  const mxH = Math.max.apply(null, hc.concat([1])), peak = hc.indexOf(mxH);
  const pad = n => (n < 10 ? '0' : '') + n;
  let h = '<div class="rng"><b>ช่วงเวลา:</b>' + [['today', 'วันนี้'], ['7', '7 วัน'], ['14', '14 วัน']].map(r => '<button class="' + (range === r[0] ? 'on' : '') + '" onclick="setRange(\'' + r[0] + '\')">' + r[1] + '</button>').join('') +
    '<span style="flex:1"></span><button onclick="exportCsv()">⬇ ดาวน์โหลด CSV</button></div>';
  h += '<div class="kpis">' +
    '<div class="k"><b>' + os.length + '</b><span>ออเดอร์ทั้งหมด (รอจัด ' + todo.length + ')</span></div>' +
    '<div class="k"><b>' + done.length + '</b><span>จัดเสร็จ' + (closed.length ? ' (ส่งต่อไรเดอร์โดยไม่กดเสร็จ ' + closed.length + ')' : '') + '</span></div>' +
    '<div class="k"><b>' + items.toLocaleString('th-TH') + '</b><span>จำนวนสินค้าที่หยิบ (รายการ)</span></div>' +
    '<div class="k"><b>' + fmtB(money) + '</b><span>ยอดเงินออเดอร์ที่จัดเสร็จ</span></div>' +
    '<div class="k"><b>' + avg + '</b><span>นาที – เวลาหยิบเฉลี่ยต่อออเดอร์</span></div></div>';
  if (noAmt) h += '<div class="muted" style="margin:-6px 0 12px">* ' + noAmt + ' ออเดอร์ยังไม่มียอดเงิน (ระบบเริ่มเก็บยอดเงินตั้งแต่ตัวอ่านเวอร์ชัน 1.5)</div>';
  // donut + ตาราง
  let off = 0;
  const seg = rows.map((r, i) => { const p = r.n / done.length * 100; const s = '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + COLORS[i % COLORS.length] + '" stroke-width="7" stroke-dasharray="' + p + ' ' + (100 - p) + '" stroke-dashoffset="' + (-off) + '"/>'; off += p; return s; }).join('');
  const donut = done.length ? '<div class="donut"><svg viewBox="0 0 42 42"><g transform="rotate(-90 21 21)">' + seg + '</g><text x="21" y="20.5" text-anchor="middle" font-size="7" font-weight="700" fill="#1d2230">' + done.length + '</text><text x="21" y="26.5" text-anchor="middle" font-size="3.4" fill="#6a7280">ออเดอร์</text></svg><div class="lg">' +
    rows.map((r, i) => '<div><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + esc(r.name) + ' · ' + r.n + ' (' + Math.round(r.n / done.length * 100) + '%)</div>').join('') + '</div></div>' : '<div class="muted">ยังไม่มีออเดอร์ที่จัดเสร็จในช่วงนี้</div>';
  h += '<div class="g2"><div class="card"><h2>สัดส่วนออเดอร์ที่จัดเสร็จ รายคน</h2>' + donut + '</div>' +
    '<div class="card"><h2>เวลาหยิบเฉลี่ยต่อออเดอร์ รายคน</h2>' + (rows.length ? rows.map((r, i) => { const t = Math.round(r.t / r.n); return '<div class="hbar"><span>' + esc(r.name) + '</span><div class="bar"><i style="width:' + Math.round(r.t / r.n / mxT * 100) + '%;background:' + COLORS[i % COLORS.length] + '"></i></div><b>' + t + ' นาที</b></div>'; }).join('') + '<div class="muted" style="margin-top:6px">นับจากเวลาที่ได้รับมอบหมายถึงเวลาที่กดจัดเสร็จ</div>' : '<div class="muted">ยังไม่มีข้อมูล</div>') + '</div></div>';
  h += '<div class="card"><h2>สรุปการ Pickup รายคน</h2><div style="overflow:auto"><table><tr><th>Picker</th><th>ออเดอร์</th><th>สัดส่วน</th><th>สินค้าที่หยิบ (รายการ)</th><th>ยอดเงิน</th><th>เวลาเฉลี่ย/ออเดอร์</th></tr>' +
    (rows.length ? rows.map(r => '<tr><td><b>' + esc(r.name) + '</b></td><td>' + r.n + '</td><td>' + Math.round(r.n / done.length * 100) + '%</td><td>' + r.items + '</td><td>' + fmtB(r.money) + '</td><td>' + Math.round(r.t / r.n) + ' นาที</td></tr>').join('') +
      '<tr style="font-weight:700"><td>รวม</td><td>' + done.length + '</td><td>100%</td><td>' + items + '</td><td>' + fmtB(money) + '</td><td>' + avg + ' นาที</td></tr>' : '<tr><td colspan="6" class="muted">ยังไม่มีข้อมูล</td></tr>') + '</table></div></div>';
  // ความหนาแน่น
  h += '<div class="card"><h2>ความหนาแน่นของออเดอร์ตามช่วงเวลา</h2>' + (os.length ? '<div class="muted" style="margin-bottom:8px">ออเดอร์เข้าหนาแน่นสุดช่วง <b style="color:var(--red)">' + pad(peak) + ':00–' + pad(peak + 1) + ':00 น.</b> (' + mxH + ' ออเดอร์' + (days > 1 ? ' รวม ' + days + ' วัน' : '') + ')</div>' : '') +
    '<div class="hours">' + hc.slice(h0, h1 + 1).map((n, i) => '<div class="' + (h0 + i === peak && n ? 'pk' : '') + '" style="height:' + Math.max(n ? 4 : 1, Math.round(n / mxH * 100)) + '%" title="' + pad(h0 + i) + ':00 – ' + n + ' ออเดอร์"></div>').join('') + '</div>' +
    '<div class="hlab">' + hc.slice(h0, h1 + 1).map((n, i) => '<span>' + (h0 + i) + '</span>').join('') + '</div>' +
    '<div class="muted" style="margin:14px 0 4px">แยกรายวัน (ตัวเลข = จำนวนออเดอร์ที่เข้าในชั่วโมงนั้น)</div><div style="overflow:auto"><table class="heat"><tr><th></th>' + hc.slice(h0, h1 + 1).map((n, i) => '<th>' + (h0 + i) + '</th>').join('') + '<th>รวม</th></tr>' +
    Array.from({ length: days }, (_, i) => { const d = new Date(from + (days - 1 - i) * 86400000), dk = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(), arr = dayHour[dk] || new Array(24).fill(0);
      return '<tr><td class="l">' + d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' }) + '</td>' + arr.slice(h0, h1 + 1).map(n => '<td style="' + (n ? 'background:rgba(215,25,32,' + (0.1 + 0.8 * n / mxH).toFixed(2) + ');color:' + (n / mxH > 0.5 ? '#fff' : '#1d2230') : 'background:#f4f5f7') + '">' + (n || '') + '</td>').join('') + '<td><b>' + arr.reduce((s, n) => s + n, 0) + '</b></td></tr>'; }).join('') + '</table></div></div>';
  return h;
}
function exportCsv() {
  const { os } = rangeOrders(), q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', t = ms => ms ? new Date(ms).toLocaleString('sv-SE') : '';
  const lines = [['order', 'items', 'amount', 'picker', 'status', 'created', 'assigned', 'done', 'pick_minutes'].map(q).join(',')].concat(os.map(o =>
    [o.id, o.items, o.amount || 0, o.picker_name, o.status, t(o.created_at), t(o.assigned_at), t(o.done_at), o.status === 'done' ? pickMin(o) : ''].map(q).join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'grab-orders-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

function guestPanel() {
  const gs = S.guests || [], pend = gs.filter(g => g.status === 'pending'), act = gs.filter(g => g.status === 'active');
  let h = '';
  if (pend.length) h += '<div class="card" style="border-color:var(--red);background:#fff6f6"><h2>🙋 มีผู้ขอเข้าช่วยจัดออเดอร์ ' + pend.length + ' คน</h2>' + pend.map(g =>
    '<div class="row" style="margin-bottom:6px"><b>' + esc(g.name) + '</b><span class="muted">ขอเมื่อ ' + mins(S.now - g.created_at) + ' นาทีก่อน</span><button class="p" onclick="guestAct(\'guestApprove\',\'' + g.id + '\')">อนุมัติ</button><button class="s" onclick="guestAct(\'guestRemove\',\'' + g.id + '\')">ปฏิเสธ</button></div>').join('') + '</div>';
  h += '<div class="card"><h2>ผู้ช่วยด่วน (ชั่วคราว)</h2><div class="muted" style="margin-bottom:8px">จัดออเดอร์ไม่ทัน? สร้าง QR ให้คนช่วยสแกน ไม่ต้องมีบัญชี Google · ขอเข้าแล้วกดอนุมัติ ระบบดึงงานค้างมาแบ่งให้ทันที · ผู้ช่วยกดยกเลิกหรือคุณกดเอาออก งานจะกลับไปแจกใหม่เอง</div>' +
    act.map(g => '<div class="row" style="margin-bottom:6px"><span class="chip ok">ผู้ช่วยด่วน</span><b>' + esc(g.name) + '</b><span class="muted">หมดเวลาใน ' + Math.max(0, Math.round((g.expires_at - S.now) / 3600000)) + ' ชม.</span><button class="s" onclick="if(confirm(\'ให้ ' + esc(g.name).replace(/\'/g, '') + ' ออกจากระบบ?\'))guestAct(\'guestRemove\',\'' + g.id + '\')">เอาออก</button></div>').join('') +
    '<div class="row" style="margin-top:6px"><button class="p" onclick="newQr()">➕ สร้าง QR ผู้ช่วยด่วน</button></div>';
  if (qr && qr.exp > Date.now()) {
    let svg = ''; try { const q = qrcode(0, 'M'); q.addData(qr.url); q.make(); svg = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch (e) {}
    h += '<div class="qrbox" style="margin-top:12px">' + svg + '<div><b>ให้ผู้ช่วยสแกน QR นี้</b><div class="muted">ใช้ได้ถึง ' + new Date(qr.exp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น. · สแกนแล้วต้องรอคุณกดอนุมัติ</div><button class="s" style="margin-top:8px" onclick="qr=null;render()">ปิด QR</button></div></div>';
  }
  return h + '</div>';
}
function newQr() { api('joinCode').then(r => { if (!r.ok) { alert('ไม่สำเร็จ: ' + r.error); return; } qr = { url: location.origin + location.pathname + '?join=' + r.code, exp: r.exp }; render(); }); }
function guestAct(a, id) { api(a, { id }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); poll(); }); }
function leaveGuest() { if (!confirm('ยกเลิกและออกจากระบบ? งานที่ค้างอยู่จะส่งต่อให้คนอื่น')) return; api('leave').then(() => endGuest('ออกจากระบบแล้ว ขอบคุณที่ช่วยครับ 🙏')).catch(() => endGuest('ออกจากระบบแล้ว')); }
let ctrlMsg = '';
const ERR = { bad_email: 'อีเมลไม่ถูกต้อง', email_exists: 'อีเมลนี้มีอยู่ในระบบแล้ว', cannot_demote_self: 'ปรับสิทธิ์หรือปิดบัญชีของตัวเองไม่ได้', cannot_change_self_email: 'เปลี่ยนอีเมลของตัวเองไม่ได้', cannot_delete_self: 'ลบตัวเองไม่ได้' };
function viewControl() {
  const list = S.pickers.filter(p => !p.guest);
  const sel = (p, r) => '<option value="' + r + '"' + (p.role === r ? ' selected' : '') + '>' + r + '</option>';
  return (ctrlMsg ? '<div class="okmsg">' + esc(ctrlMsg) + '</div>' : '') +
    '<div class="card"><h2>ทีมงานและสิทธิ์</h2><div class="muted" style="margin-bottom:8px">แก้ชื่อ อีเมล สิทธิ์ หรือสถานะ แล้วกด <b>บันทึก</b> ที่แถวนั้น · picker = รับงานจัดของ · viewer = ดู Dashboard อย่างเดียว · admin = จัดการทั้งหมด · "อยู่ในทีม" ปิดเมื่อหยุดยาว/ลาออก (งานค้างจะถูกแจกให้คนอื่นทันที) · ถ้าเปลี่ยนอีเมล คนนั้นต้องล็อกอินด้วยอีเมลใหม่ (และต้องเป็น Test user ใน Google Cloud)</div>' +
    '<div style="overflow:auto"><table><tr><th>ชื่อ</th><th>อีเมล Google</th><th>สิทธิ์</th><th>อยู่ในทีม</th><th>สถานะตอนนี้</th><th></th></tr>' + list.map((p, i) =>
      '<tr><td><input id="cN_' + i + '" value="' + esc(p.name) + '" size="14"></td><td><input id="cE_' + i + '" value="' + esc(p.email) + '" size="26"></td>' +
      '<td><select id="cR_' + i + '">' + sel(p, 'picker') + sel(p, 'viewer') + sel(p, 'admin') + '</select></td>' +
      '<td style="text-align:center"><input type="checkbox" id="cA_' + i + '" ' + (p.active ? 'checked' : '') + '></td>' +
      '<td>' + (p.role !== 'picker' ? '' : !p.active ? '<span class="chip">ไม่อยู่ในทีม</span>' : !p.duty ? '<span class="chip warn">พัก</span>' : p.online ? '<span class="chip ok">พร้อมรับงาน</span>' : '<span class="chip">ออฟไลน์</span>') + '</td>' +
      '<td style="white-space:nowrap"><button class="p" style="padding:6px 12px" onclick="editPicker(' + i + ',this)">บันทึก</button> <button class="s" onclick="delPicker(\'' + esc(p.email) + '\')">ลบ</button></td></tr>').join('') + '</table></div></div>' +
    '<div class="card"><h2>เพิ่มคนใหม่</h2><div class="row"><input id="nName" placeholder="ชื่อ"><input id="nMail" placeholder="อีเมล Google" size="26"><select id="nRole"><option value="picker">picker (คนจัดของ)</option><option value="viewer">viewer (ดูอย่างเดียว)</option><option value="admin">admin</option></select><button class="p" onclick="addPicker()">เพิ่ม</button></div></div>' +
    '<div class="card"><h2>เครื่องมือ</h2><button class="s" onclick="if(confirm(\'แจกงานค้างทั้งหมดใหม่ตามภาระงานปัจจุบัน?\'))act(\'redistribute\')">แจกงานค้างใหม่ทั้งหมด</button></div>';
}
function clearCtrlDrafts() { Object.keys(draft).forEach(k => { if (/^c[NERA]_/.test(k)) delete draft[k]; }); }
function editPicker(i, btn) {
  const p = S.pickers.filter(x => !x.guest)[i]; if (!p) return;
  const body = { oldEmail: p.email, email: $('cE_' + i).value.trim(), name: $('cN_' + i).value.trim(), role: $('cR_' + i).value, active: $('cA_' + i).checked };
  if (btn) { btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก…'; }
  api('savePicker', body).then(r => {
    if (!r.ok) { alert('บันทึกไม่สำเร็จ: ' + (ERR[r.error] || r.error)); if (btn) { btn.disabled = false; btn.textContent = 'บันทึก'; } return; }
    clearCtrlDrafts(); ctrlMsg = '✅ บันทึกแล้ว: ' + (body.name || body.email); poll(); render(); setTimeout(() => { ctrlMsg = ''; if (S) render(); }, 3500);
  }).catch(() => { alert('เชื่อมต่อไม่ได้ ยังไม่ได้บันทึก'); if (btn) { btn.disabled = false; btn.textContent = 'บันทึก'; } });
}
function setDuty(on) { if (S) { const mp = S.pickers.find(p => p.key === S.me.email); if (mp) mp.duty = on; render(); } api('duty', { on }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); poll(); }); }
function setTab(t) { tab = t; clearCtrlDrafts(); render(); }
function act(action, id, email) { api(action, { id, email }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); poll(); }); }
function savePicker(email, name, role, active) { api('savePicker', { email, name, role, active }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); poll(); }); }
function delPicker(email) { if (confirm('ลบ ' + email + ' ออกจากระบบ?')) api('delPicker', { email }).then(r => { if (!r.ok) alert('ไม่สำเร็จ: ' + r.error); poll(); }); }
function addPicker() { const n = $('nName').value.trim(), m = $('nMail').value.trim(), r = $('nRole').value; if (!m) return; api('savePicker', { email: m, name: n || m, role: r, active: true }).then(x => { if (!x.ok) alert('ไม่สำเร็จ: ' + x.error); else { delete draft.nName; delete draft.nMail; } poll(); }); }
function logout() { try { if (token) api('logout'); } catch (e) {} token = null; S = null; try { localStorage.removeItem('gd_token'); } catch (e) {} try { google.accounts.id.disableAutoSelect(); } catch (e) {} showLogin(); }

try { token = localStorage.getItem('gd_token'); } catch (e) {}
if (gtoken) token = null;
$('app').innerHTML = '<div class="login">กำลังโหลด…</div>';
if (gtoken) poll(); else { initGoogle(); if (token) poll(); }
setInterval(poll, 8000);
</script>
